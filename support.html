<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support - Sikka 99</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-custom-green { background: linear-gradient(135deg, #00b074 0%, #00da83 100%); }
    </style>
</head>
<body class="bg-[#f7f8fa] min-h-screen flex flex-col justify-between text-gray-800">

    <!-- Top Header Bar -->
    <div class="bg-custom-green px-4 py-3.5 flex items-center justify-between shadow-md sticky top-0 z-50">
        <a href="profile.html" class="text-white hover:text-gray-100 transition p-1">
            <i class="fa-solid fa-chevron-left text-base"></i>
        </a>
        <h1 class="text-base font-bold text-white absolute left-1/2 -translate-x-1/2">Customer Support</h1>
        <div class="flex items-center space-x-1 bg-white/20 px-2.5 py-1 rounded-full text-white text-[10px] font-semibold">
            <span class="w-2 h-2 rounded-full bg-green-300 animate-pulse"></span>
            <span>Online</span>
        </div>
    </div>

    <!-- Chat Messages Container -->
    <div id="chatContainer" class="flex-1 px-4 py-4 space-y-3 overflow-y-auto max-h-[calc(100vh-140px)]">
        <!-- Welcome message will be loaded via script -->
    </div>

    <!-- Message Input Bar -->
    <div class="bg-white border-t border-gray-200 p-3 sticky bottom-0 z-40 flex items-center space-x-2 shadow-lg">
        <input type="text" id="messageInput" placeholder="Type your message here..." class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-xs font-medium outline-none focus:border-emerald-500 transition">
        <button type="button" onclick="sendMessage()" class="bg-custom-green text-white w-11 h-11 rounded-xl shadow-md flex items-center justify-center hover:opacity-95 transition shrink-0">
            <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
    </div>

    <!-- LocalStorage Chat Logic with 20+ Advanced Commands -->
    <script>
        const chatContainer = document.getElementById('chatContainer');
        const STORAGE_KEY = 'sikka99_chat_messages';
        const STATE_KEY = 'sikka99_chat_state';

        // Page load hone par session clear karo
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(STATE_KEY);

        // Render Messages Function
        function renderMessages() {
            const messages = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            
            let htmlContent = `
                <div class="flex items-start space-x-2">
                    <div class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-sm">
                        <i class="fa-solid fa-headset"></i>
                    </div>
                    <div class="bg-white rounded-2xl rounded-tl-sm p-3.5 shadow-sm max-w-[80%] border border-gray-100 text-xs leading-relaxed">
                        <p class="font-bold text-emerald-600 mb-1">Sikka 99 Support</p>
                        Hello! Welcome to Sikka 99 support. How can we help you today?
                    </div>
                </div>
            `;

            messages.forEach((msg) => {
                if (msg.sender === 'user') {
                    htmlContent += `
                        <div class="flex items-end justify-end space-x-2 mt-3">
                            <div class="bg-emerald-600 text-white rounded-2xl rounded-tr-sm p-3.5 shadow-sm max-w-[80%] text-xs leading-relaxed">
                                ${escapeHtml(msg.text)}
                            </div>
                        </div>
                    `;
                } else {
                    htmlContent += `
                        <div class="flex items-start space-x-2 mt-3">
                            <div class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-sm">
                                <i class="fa-solid fa-headset"></i>
                            </div>
                            <div class="bg-white rounded-2xl rounded-tl-sm p-3.5 shadow-sm max-w-[80%] border border-gray-100 text-xs leading-relaxed">
                                <p class="font-bold text-emerald-600 mb-1">Admin Support</p>
                                ${msg.text}
                            </div>
                        </div>
                    `;
                }
            });

            chatContainer.innerHTML = htmlContent;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Send Message Function
        function sendMessage() {
            const inputEl = document.getElementById('messageInput');
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';

            const messages = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            messages.push({
                sender: 'user',
                text: text,
                timestamp: Date.now()
            });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
            renderMessages();

            // Auto Reply & 20+ Smart Commands Logic
            setTimeout(() => {
                let replyText = "Thank you for contacting Sikka 99 support. Our agent will review your query shortly.";
                const lowerText = text.toLowerCase();
                let currentState = localStorage.getItem(STATE_KEY);

                // 1. UTR Flow Check
                if (currentState === 'waiting_for_utr' && /\d/.test(text)) {
                    replyText = `<span style="font-family: monospace; letter-spacing: 0.5px;">⚡ <b>Status: Processing</b></span><br>Your deposit has been processing securely. Please wait a moment while we verify your UTR: <b>${escapeHtml(text)}</b> ✨`;
                    localStorage.removeItem(STATE_KEY);
                } 
                // 2. Deposit / Add Money Flow Trigger
                else if (lowerText.includes('deposit') || lowerText.includes('add money') || lowerText.includes('recharge') || lowerText.includes('balance not') || lowerText.includes('paise add')) {
                    replyText = "Please enter your UTR number.";
                    localStorage.setItem(STATE_KEY, 'waiting_for_utr');
                } 
                // --- 20+ Additional Smart Commands ---
                else if (lowerText.includes('how are you') || lowerText.includes('kese ho') || lowerText.includes('kaise ho')) {
                    replyText = "I'm fine, thank you for asking! 😊 How can I help you with Sikka 99 today?";
                } 
                else if (lowerText.includes('hi') || lowerText.includes('hello') || lowerText.includes('hey') || lowerText.includes('hii') || lowerText.includes('gm')) {
                    replyText = "Hello! Welcome to Sikka 99 support. How can we assist you today?";
                } 
                else if (lowerText.includes('withdraw') || lowerText.includes('withdrawal') || lowerText.includes('paisa nikalna')) {
                    replyText = "Minimum ₹200 deposit is required to make a withdrawal.";
                } 
                else if (lowerText.includes('help') || lowerText.includes('support') || lowerText.includes('customer care')) {
                    replyText = "I am here to help you! You can ask about deposits, withdrawals, bonuses, or technical issues.";
                } 
                else if (lowerText.includes('bonus') || lowerText.includes('promocode') || lowerText.includes('promo code') || lowerText.includes('offer')) {
                    replyText = "🎁 Check your profile section or active events page to claim your latest bonuses and rewards.";
                } 
                else if (lowerText.includes('password') || lowerText.includes('forgot') || lowerText.includes('login issue') || lowerText.includes('otp')) {
                    replyText = "If you are facing login or OTP issues, please check your network connection or try clearing your browser cache.";
                } 
                else if (lowerText.includes('game') || lowerText.includes('play') || lowerText.includes('win') || lowerText.includes('trick')) {
                    replyText = "Play responsibly and follow the game rules carefully to maximize your winning chances on Sikka 99!";
                } 
                else if (lowerText.includes('time') || lowerText.includes('timing') || lowerText.includes('open') || lowerText.includes('hours')) {
                    replyText = "🕒 Our support team and platform services are available 24/7 round the clock for you.";
                } 
                else if (lowerText.includes('thanks') || lowerText.includes('thank you') || lowerText.includes('ok') || lowerText.includes('thx') || lowerText.includes('good')) {
                    replyText = "You're most welcome! Have a great time playing and winning on Sikka 99. 🚀";
                } 
                else if (lowerText.includes('bye') || lowerText.includes('goodbye') || lowerText.includes('tata')) {
                    replyText = "Goodbye! Feel free to reach out anytime if you need further assistance. Take care! 👋";
                } 
                else if (lowerText.includes('owner') || lowerText.includes('admin') || lowerText.includes('creator') || lowerText.includes('developer')) {
                    replyText = "You are interacting with the official automated Assistant of Sikka 99 Support.";
                } 
                else if (lowerText.includes('safe') || lowerText.includes('secure') || lowerText.includes('trust')) {
                    replyText = "Yes, Sikka 99 is 100% safe and secure for all your transactions and gameplay data.";
                } 
                else if (lowerText.includes('upi') || lowerText.includes('bank') || lowerText.includes('qr code') || lowerText.includes('scanner')) {
                    replyText = "Make sure you always use the official active scanner or UPI ID provided on the deposit page.";
                } 
                else if (lowerText.includes('refer') || lowerText.includes('invite') || lowerText.includes('friend')) {
                    replyText = "Invite your friends using your referral link to earn exciting commission rewards instantly!";
                } 
                else if (lowerText.includes('error') || lowerText.includes('bug') || lowerText.includes('glitch') || lowerText.includes('lag')) {
                    replyText = "Apologies for the inconvenience. Please refresh your page or restart the app if you encounter any visual glitches.";
                } 
                else if (lowerText.includes('fast') || lowerText.includes('delay') || lowerText.includes('pending')) {
                    replyText = "Transactions usually take a few moments. If delayed, sharing the correct UTR speeds up verification.";
                }

                const updatedMessages = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
                updatedMessages.push({
                    sender: 'admin',
                    text: replyText,
                    timestamp: Date.now()
                });

                localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedMessages));
                renderMessages();
            }, 1000);
        }

        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        renderMessages();
    </script>
</body>
</html>
